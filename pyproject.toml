[build-system]
requires = [
    "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "statistics-canada"
authors = [
    {name="Paul Bouillon", email="pbouill@gmail.com"},
]
description = "Python bindings for the Statistics Canada Web Data Service (WDS) API"
license = "GPL-3.0-or-later" 
license-files = ['LICENSE']  #, "LICENSE.*"]
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "python", 
    "statistics",
    "census",
    "canada",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dynamic = [
    "version", 
    "dependencies"
]

[project.urls]
"Homepage" = "https://github.com/pbouill/statistics-canada"
"Repository" = "https://github.com/pbouill/statistics-canada.git"
"Bug Tracker" = "https://github.com/pbouill/statistics-canada/issues"
"Changelog" = "https://github.com/pbouill/statistics-canada/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."] # Look for packages in the current directory
exclude = [
    ".*",
    "data*",
    "dist*",
    "docs*",
    "examples*",
    "scratch*",
    "tests*",
    "tools*"
]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.ico", "*.js"]

[tool.setuptools.dynamic]
version = {attr = "_version.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
markers = [
    "dependency: tests that require network or external dependencies",
    "network: tests that make live network calls to generate fixtures",
    "mock: tests that use mocked responses instead of live API calls",
    "slow: tests that take a long time to run"
]
# Configure pytest-asyncio to use session-scoped event loops
# This allows session-scoped async fixtures to work properly
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

# Network tests are automatically prioritized by pytest_collection_modifyitems hook

[tool.ruff]
# Set the target Python version for compatibility checks.
target-version = "py314"
# Align the line length with the formatter for consistent styling.
line-length = 88

# --- Linting Configuration ---
[tool.ruff.lint]
# Select the default rules plus a comprehensive set of common plugins.
# F: Pyflakes errors
# E, W: Pycodestyle errors and warnings
# I: isort for import sorting
# B: flake8-bugbear for common bugs
# UP: pyupgrade for modern syntax
# N: PEP 8 naming conventions
# S: bandit for security issues
# D: pydocstyle for docstrings
# T20: flake8-print for `print` statements
# PLC, PLE, PLR, PLW: Pylint rules
select = ["F", "E", "W", "I", "B", "UP", "N", "S", "D", "T20", "PLC", "PLE", "PLR", "PLW"]

# Ignore rules that may not be suitable for your project.
# Example: D203 (1 blank line required before class docstring) can conflict with other formatters.
ignore = ["D203", "D213"]

# Treat all rules in the `select` list as fixable. This overrides Ruff's default safety checks.
# Be aware: This will attempt to fix all linting issues, including potentially destructive ones.
fixable = ["ALL"]

# --- Formatting Configuration ---
[tool.ruff.format]
# The format section controls how Ruff formats your code.
# The formatter handles fixes for styling issues, such as line length.
# This section ensures consistent formatting alongside linting autofixes.
quote-style = "single"
indent-style = "tab"

# Disable specific rules for specific directories or files.
[tool.ruff.lint.per-file-ignores]
"tools/*" = ["T20", "PLW", "PLR", "D"]
"tests/*" = ["S101", "D", "E501", "PLR2004"]
"statscan/wds/models/*" = ["N815"]
# Auto-generated enums: allow non-ASCII names (French/Indigenous) and long lines (census data)
"statscan/enums/auto/**/*.py" = ["E501", "PLC2401"]