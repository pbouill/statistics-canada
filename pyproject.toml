[build-system]
requires = [
    "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "statistics-canada"
authors = [
    {name="Paul Bouillon", email="pbouill@gmail.com"},
]
description = "Python bindings for the Statistics Canada Web Data Service (WDS) API"
license = "GPL-3.0-or-later" 
license-files = ['LICENSE']  #, "LICENSE.*"]
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "python", 
    "statistics",
    "census",
    "canada",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dynamic = [
    "version", 
    "dependencies",
    "optional-dependencies"
]

[project.urls]
"Homepage" = "https://github.com/pbouill/statistics-canada"
"Repository" = "https://github.com/pbouill/statistics-canada.git"
"Bug Tracker" = "https://github.com/pbouill/statistics-canada/issues"
"Changelog" = "https://github.com/pbouill/statistics-canada/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."] # Look for packages in the current directory
exclude = [
    ".*",
    "data*",
    "dist*",
    "docs*",
    "examples*",
    "scratch*",
    "tests*",
    "tools*"
]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.ico", "*.js"]

[tool.setuptools.dynamic]
version = {attr = "_version.__version__"}
dependencies = {file = ["requirements.txt"]}
# User-facing optional features
optional-dependencies.mcp = {file = ["requirements.mcp.txt"]}
# Development and CI/CD tools (dev-* prefix)
optional-dependencies.dev-tools = {file = ["requirements.tools.txt"]}
optional-dependencies.dev-testing = {file = ["requirements.testing.txt"]}
optional-dependencies.dev-typing = {file = ["requirements.typing.txt"]}
optional-dependencies.dev-lint = {file = ["requirements.lint.txt"]}
optional-dependencies.dev-audit = {file = ["requirements.audit.txt"]}
optional-dependencies.dev-extra = {file = ["requirements.dev-extra.txt"]}
# Convenience bundles (note: requirements.txt already included via dependencies)
optional-dependencies.all = {file = ["requirements.mcp.txt"]}
optional-dependencies.dev = {file = [
    "requirements.tools.txt",
    "requirements.testing.txt",
    "requirements.typing.txt",
    "requirements.lint.txt",
    "requirements.audit.txt",
    "requirements.mcp.txt",
    "requirements.dev-extra.txt"
]}

[tool.pytest.ini_options]
markers = [
    "network: tests that make live network calls to generate fixtures (opt-in with --network)"
]
# Configure pytest-asyncio to use session-scoped event loops
# This allows session-scoped async fixtures to work properly
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
# Set the target Python version for compatibility checks.
target-version = "py314"
# Align the line length with the formatter for consistent styling.
line-length = 88

# --- Linting Configuration ---
[tool.ruff.lint]
# Select the default rules plus a comprehensive set of common plugins
select = [
	"F",    # Pyflakes errors
	"E",    # Pycodestyle errors
	"W",    # Pycodestyle warnings
	"I",    # isort for import sorting
	"B",    # flake8-bugbear for common bugs
	"UP",   # pyupgrade for modern syntax
	"N",    # PEP 8 naming conventions
	"S",    # bandit/flake8-bandit security rules (Python 3.14 compatible, replaces standalone bandit)
	"D",    # pydocstyle for docstrings
	"T20",  # flake8-print for `print` statements
	"PLC",  # Pylint convention rules
	"PLE",  # Pylint error rules
	"PLR",  # Pylint refactor rules
	"PLW",  # Pylint warning rules
]

# Ignore rules that may not be suitable for your project
ignore = [
	"D203",  # 1 blank line required before class docstring (conflicts with D211)
	"D213",  # Multi-line docstring summary should start at the second line (conflicts with D212)
]

# Treat all rules in the `select` list as fixable. This overrides Ruff's default safety checks.
# Be aware: This will attempt to fix all linting issues, including potentially destructive ones.
fixable = ["ALL"]

# --- Formatting Configuration ---
[tool.ruff.format]
# The format section controls how Ruff formats your code.
# The formatter handles fixes for styling issues, such as line length.
# This section ensures consistent formatting alongside linting autofixes.
quote-style = "single"
indent-style = "tab"

# Disable specific rules for specific directories or files
[tool.ruff.lint.per-file-ignores]
".github/scripts/*" = [
	"T20",  # flake8-print: Scripts need to print output for workflows
	"D",    # pydocstyle: Documentation not required for workflow scripts
]
"tools/*" = [
	"T20",  # flake8-print: Allow print statements in dev tools
	"PLW",  # Pylint warnings: Not critical for dev tools
	"PLR",  # Pylint refactor: Not critical for dev tools
	"D",    # pydocstyle: Documentation not required for dev tools
	"S",    # Security checks: Not needed for dev tools
]
"tests/*" = [
	"S101",    # Assert used: Required for pytest
	"D",       # pydocstyle: Documentation not required for tests
	"E501",    # Line too long: Test data can be long
	"PLR2004", # Magic value used in comparison: Common in tests
]
"examples/*" = [
	"S",   # Security checks: Examples may show patterns to avoid
	"T20", # flake8-print: Print statements needed for demos
]
"scratch/*" = [
	"ALL",  # Scratch files are temporary debug/analysis scripts
]
"statscan/wds/models/*" = ["N815"]
# Auto-generated enums: allow non-ASCII names (French/Indigenous) and long lines (census data)
"statscan/enums/auto/**/*.py" = ["E501", "PLC2401"]

[tool.mypy]
# Mypy type checking configuration  

# Show error codes for easier lookup and fixing
show_error_codes = true

# Show full traceback on internal errors for debugging
show_traceback = true

# Exclude files/directories in .gitignore automatically
# NOTE: This doesn't seem to work reliably in mypy 1.18.2, so we explicitly list critical dirs
exclude_gitignore = true

# Explicitly exclude directories to avoid scanning (regex patterns)
# Note: Paths may be relative (./path) or absolute, so patterns must account for this
exclude = [
    "statscan/enums/auto",     # Large auto-generated enum files (8000+ lines) - match directory name
    "^\\.[^/]+/",              # All dot-prefixed directories (.venv/, .mypy_cache/, .pytest_cache/, etc.)
]

# Skip type-checking for specific modules (prevents mypy from loading huge auto-generated enums)
# This is critical: even with exclude above, mypy still type-checks imports from these modules
# when checking files that import them (e.g., statscan/wds/client.py imports ProductID)
[[tool.mypy.overrides]]
module = "statscan.enums.auto.*"
ignore_errors = true
follow_imports = "skip"
disallow_untyped_defs = false
